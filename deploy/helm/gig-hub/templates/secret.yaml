apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "gig-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- if .Values.flaresolverr.enabled }}
  FETCHERS_FLARESOLVERR_URL: {{ printf "http://%s.%s.svc.cluster.local:%v/v1" (include "gig-hub.flaresolverr.name" .) .Release.Namespace .Values.flaresolverr.port | quote }}
  {{- end }}
